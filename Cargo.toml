[package]
name = "pushdown-rs"
version = "0.1.0"
edition = "2021"
description = "Pushdown automata (PDA/DPDA/NPDA) as composable traits, compiled from any finite-state grammar, producing flat bitvec machine encodings for CPU/SIMD/GPU execution"
license = "MIT"
repository = "https://github.com/sempervictus/pushdown-rs"
keywords = ["pushdown", "pda", "dpda", "automata", "grammar", "constrained-decoding"]
categories = ["compilers", "science"]

# Standalone workspace root: this crate is checked out for development inside
# the llguidance tree (the .pushdown-rs) but builds independently. The empty
# [workspace] table keeps it out of the parent workspace so `cargo test` here
# runs the crate's own suite (the 54 proofs + the benches).
[workspace]

# the local benchmark fixtures (the the 248K tokenizer + the grammar samples) are
# dev-only; they are not part of the published package.
exclude = [
    "bench_realworld/",
]

[dependencies]
bitvec = "1"
rten-simd = { version = "0.26", optional = true }
fearless_simd = { version = "1.0", optional = true }
smoltcp = { version = "0.12", optional = true }

[features]
default = ["simd"]
# the SIMD branch (the rten-simd + the fearless_simd). ON by default: the
# step_batch / project_batch streaming interface is the primary path. The scalar
# code stays as the fallback when the simd feature is disabled (the
# --no-default-features). The fearless_simd provides the AVX-512 VGATHER (the
# CSR gather, the B lanes gather their CSR rows in parallel) + the portable
# fallback (the AVX2, the SSE2, the NEON, the WASM).
simd = ["dep:rten-simd", "dep:fearless_simd"]
# the CUDA FFI declarations (the the extern "C" block, the the pda_ffi.h contract).
# The the attention-rs provides the implementations; this is the declaration
# side (the the compiles without a GPU, the the links against the attention-rs).
cuda = []
# the DPDK line-rate NIC backend (the the rust-dpdk-net style). When on, the
# appliance uses the DPDK rx/tx rings; when off, the native NIC binding.
dpdk = []
# the smoltcp packet-structure adapter (the the smoltcp owns the wire formats;
# the PDA validates the same structure smoltcp parses).
smoltcp = ["dep:smoltcp"]

[dev-dependencies]
criterion = "0.5"
nom = "7"
deku = "0.20"
tokenizers = "0.13"
serde_json = "1"

[[bench]]
name = "simd_bench"
harness = false
required-features = ["simd"]

[[bench]]
name = "modality_bench"
harness = false
required-features = ["simd"]

[[bench]]
name = "pda_mask_bench"
harness = false